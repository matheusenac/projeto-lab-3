{% extends 'base.html' %}
{% block content %}
    <div class="container-produtos">
        {% for produto in produtos %}
        <div class="card-produto">
            <img src="{{produto[4]}}" alt="{{produto[1]}}">
            <p class="nome">{{produto[1]}}</p>
            <p class="preco">R$ {{produto[3]}}</p>
            <button class="btn-add" type="submit" value="Adicionar ao Carrinho" onclick="location.href='carrinho/{{ produto[0] }}'"><img class="icon-cart" src="../static/images/iconCart.png">Adicionar</button>
        </div>
        {% endfor %}
    </div>
{% endblock %}
